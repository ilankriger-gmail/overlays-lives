<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b09">
<title>Chat + Roteiro — Depois do Te Amo</title>

<!--
  Container pra ABRIR NO CELULAR e acompanhar CHAT + ROTEIRO ao mesmo tempo.

  - O chat é o seu widget do Botrix (junta Twitch/YouTube/Kick), embutido como está.
  - O roteiro é editável logo abaixo (const ROTEIRO): blocos com itens que você
    marca tocando. O que você marca fica salvo no aparelho (localStorage).
  - 3 modos no topo: Dividido / Só roteiro / Só chat.

  PRA TROCAR O ROTEIRO: edite o array ROTEIRO lá embaixo no <script>.
  PRA TROCAR O CHAT: edite a const CHAT_URL.

  Dica: no celular use "Adicionar à tela de início" pra abrir como app.
-->

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0b09;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #f3ede4;
  }
  :root {
    --amarelo: #ffd23a;
    --laranja: #ff8a2e;
    --vermelho: #e8420e;
    --cinza: #cabfb0;
  }

  #app {
    position: fixed; inset: 0;
    --split: 45%;                     /* quanto do espaço vai pro roteiro (arrastável) */
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* barra de topo com os 3 modos */
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px;
    background: linear-gradient(180deg, rgba(255,138,46,.10), transparent);
    border-bottom: 1px solid rgba(255,138,46,.18);
  }
  .brand {
    display: flex; align-items: center; gap: 6px; min-width: 0;
    font-family: 'Luckiest Guy', system-ui, sans-serif;
    color: var(--amarelo); font-weight: 700; font-size: 12px;
    letter-spacing: 0; text-transform: uppercase; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .brand .label { overflow: hidden; text-overflow: ellipsis; }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--vermelho);
    box-shadow: 0 0 0 0 rgba(232,66,14,.6); animation: ring 2s ease-out infinite;
  }
  @keyframes ring { 0%{box-shadow:0 0 0 0 rgba(232,66,14,.6)} 100%{box-shadow:0 0 0 8px rgba(232,66,14,0)} }
  .modes { margin-left: auto; flex: 1 1 auto; display: flex; gap: 3px; background: rgba(255,255,255,.06); padding: 3px; border-radius: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .modes::-webkit-scrollbar { display: none; }
  .modes button { flex: 0 0 auto; }
  .modes button {
    appearance: none; border: 0; background: transparent; color: var(--cinza);
    font-size: 11px; font-weight: 700; padding: 7px 9px; border-radius: 8px; cursor: pointer;
    letter-spacing: 0; white-space: nowrap;
  }
  .modes button.active { background: var(--laranja); color: #17130f; }

  /* área principal: empilha roteiro em cima, chat embaixo */
  .content { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }

  /* painel do roteiro */
  #roteiro {
    flex: 0 0 var(--split, 45%); min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px 20px;
    background:
      radial-gradient(120% 40% at 50% 0%, rgba(255,138,46,.06), transparent 70%),
      #100d0a;
  }
  .bloco { margin-bottom: 16px; }
  .bloco h2 {
    margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--amarelo);
    display: flex; align-items: center; gap: 8px;
  }
  .bloco h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,138,46,.4), transparent); }
  .item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 12px; margin-bottom: 7px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 12px;
    font-size: 15px; line-height: 1.35;
    cursor: pointer; transition: background .15s, opacity .15s;
  }
  .item:active { background: rgba(255,255,255,.09); }
  .item .box {
    flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px;
    border-radius: 6px; border: 2px solid rgba(255,210,58,.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #17130f; font-weight: 900;
  }
  .item.done { opacity: .45; }
  .item.done .box { background: var(--amarelo); border-color: var(--amarelo); }
  .item.done .box::after { content: "✓"; }
  .item.done .txt { text-decoration: line-through; }
  .item.pergunta .txt::before { content: "❓ "; }
  /* linha de nota (regra de pontos, ranking, etc.) — sem caixa de marcar */
  .note {
    padding: 4px 12px 8px 44px; margin: -3px 0 7px;
    font-size: 13px; line-height: 1.35; color: var(--cinza);
  }
  .note.forte { color: var(--amarelo); font-weight: 700; }

  /* divisória ARRASTÁVEL entre roteiro e chat (puxe pra cima/baixo) */
  .divider {
    flex: 0 0 auto; height: 22px;
    display: flex; align-items: center; justify-content: center;
    background: #0d0b09; border-top: 1px solid rgba(255,138,46,.18); border-bottom: 1px solid rgba(0,0,0,.4);
    cursor: row-resize; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .divider::before {
    content: ""; width: 60px; height: 5px; border-radius: 3px;
    background: rgba(255,210,58,.45);
  }
  .divider.dragging::before { background: var(--laranja); }

  /* painel do chat (mini-vídeo em cima + chat embaixo) */
  #chatBox { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: #0d0b09; }
  /* mini-preview da live (só no modo Dividido) */
  #miniLive {
    flex: 0 0 auto; position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; border-bottom: 1px solid rgba(255,138,46,.25); display: none;
  }
  #miniSlot { position: absolute; inset: 0; background: #000; }
  .livebadge {
    position: absolute; top: 6px; left: 8px; z-index: 61;
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px;
    pointer-events: none;
  }
  .livebadge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--vermelho); }
  #chatInner { flex: 1 1 auto; position: relative; min-height: 0; }
  #chatInner iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  .chatlabel {
    position: absolute; top: 6px; left: 10px; z-index: 2;
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--cinza);
    opacity: .7; pointer-events: none;
  }
  /* aba Live: vídeo em tela cheia */
  #liveBox { flex: 1 1 auto; min-height: 0; position: relative; background: #000; display: none; }
  #fullSlot { position: absolute; inset: 0; background: #000; }

  /* ===== PLACAR / RANKING ===== */
  #pontosBox { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; background: #100d0a; }
  .pt-inner { padding: 12px 12px 24px; }
  .pt-h { margin: 18px 0 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--amarelo);
    display: flex; align-items: center; gap: 8px; }
  .pt-h:first-child { margin-top: 2px; }
  .pt-h::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,138,46,.4), transparent); }
  .desafio { margin-bottom: 12px; }
  .d-nome { font-size: 14px; margin-bottom: 7px; color: #f3ede4; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts button {
    appearance: none; border: 1.5px solid rgba(255,210,58,.35); background: rgba(255,255,255,.04);
    color: var(--cinza); font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 10px; cursor: pointer;
  }
  .opts button.sel { background: var(--amarelo); color: #17130f; border-color: var(--amarelo); }
  .opts button:active { transform: scale(.97); }
  .subtotal { margin: 12px 0 4px; font-size: 15px; color: var(--cinza); }
  .subtotal b { color: #fff; font-size: 18px; }

  .crono { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 4px; }
  .crono-time { font-family: 'Space Grotesk', monospace; font-size: 30px; font-weight: 700; color: #fff; min-width: 92px; }
  .crono-btns { display: flex; gap: 6px; }
  .crono-btns button {
    appearance: none; border: 0; border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
    background: var(--laranja); color: #17130f;
  }
  #cronoReset { background: rgba(255,255,255,.1); color: var(--cinza); }
  #cronoStart.running { background: var(--vermelho); color: #fff; }
  .seg-lbl { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--cinza); letter-spacing: .04em; }
  .seg-lbl input { width: 110px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #fff;
    font-size: 16px; padding: 8px 10px; border-radius: 8px; }

  .final { margin: 16px 0; padding: 14px; border-radius: 14px; text-align: center;
    background: linear-gradient(160deg, rgba(255,138,46,.16), rgba(232,66,14,.10)); border: 1px solid rgba(255,138,46,.4); }
  .final-calc { font-size: 13px; color: var(--cinza); }
  .final-num { font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; color: var(--amarelo); line-height: 1.1; }
  .final-lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--cinza); }

  .salvar-row { display: flex; gap: 8px; }
  .salvar-row input { flex: 1 1 auto; min-width: 0; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    color: #fff; font-size: 15px; padding: 10px 12px; border-radius: 10px; }
  #salvarRanking { flex: 0 0 auto; border: 0; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 700;
    background: var(--amarelo); color: #17130f; cursor: pointer; }

  #rankingList { display: flex; flex-direction: column; gap: 7px; }
  .rk {
    display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 12px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
  }
  .rk .pos { font-size: 18px; width: 26px; text-align: center; }
  .rk .nome { flex: 1 1 auto; font-size: 16px; color: #f3ede4; }
  .rk .pts { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: var(--amarelo); }
  .rk .del { background: none; border: 0; color: rgba(202,191,176,.5); font-size: 16px; cursor: pointer; padding: 2px 6px; }
  .rk.novo { border-color: var(--amarelo); box-shadow: 0 0 0 1px var(--amarelo), 0 0 22px rgba(255,210,58,.25); }

  /* ===== PLAYER FLUTUANTE ===== */
  #floatLive {
    position: fixed; z-index: 50; width: 190px; left: auto; right: 10px; top: 70px;
    background: #000; border-radius: 12px; overflow: hidden;
    box-shadow: 0 12px 34px rgba(0,0,0,.6), 0 0 0 1px rgba(255,138,46,.5);
    display: none; touch-action: none;
  }
  .float-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 5px 6px 5px 8px; background: #17130f; cursor: grab; touch-action: none;
  }
  .float-bar:active { cursor: grabbing; }
  .float-close { appearance: none; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 12px;
    width: 22px; height: 22px; border-radius: 6px; cursor: pointer; line-height: 1; }
  #floatSlot { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  /* player único, reposicionado por JS sobre o slot ativo */
  #livePlayer { position: fixed; z-index: 60; border: 0; background: #000; display: none; }

  /* modos: escondem/mostram painéis */
  #app[data-mode="roteiro"] .divider,
  #app[data-mode="roteiro"] #chatBox { display: none; }
  #app[data-mode="roteiro"] #roteiro { flex-basis: 100%; }
  #app[data-mode="chat"] .divider,
  #app[data-mode="chat"] #roteiro { display: none; }
  #app[data-mode="chat"] #chatBox { flex-basis: 100%; }
  /* mini-preview embutido aparece só na view "+ Preview" */
  #app[data-mode="splitprev"] #miniLive { display: block; }
  /* preview flutuante aparece só na view "+ Flutuante" */
  #app[data-mode="splitfloat"] #floatLive { display: block; }
  /* modo Live: só o vídeo cheio */
  #app[data-mode="live"] #roteiro,
  #app[data-mode="live"] .divider,
  #app[data-mode="live"] #chatBox { display: none; }
  #app[data-mode="live"] #liveBox { display: block; }
  /* modo Pontos: só o placar */
  #app[data-mode="pontos"] #roteiro,
  #app[data-mode="pontos"] .divider,
  #app[data-mode="pontos"] #chatBox { display: none; }
  #app[data-mode="pontos"] #pontosBox { display: block; }
  /* durante o arraste, os iframes não “roubam” o toque */
  #app.resizing #chatInner iframe,
  #app.resizing #livePlayer { pointer-events: none; }

  .reset {
    display: block; width: 100%; margin-top: 6px;
    background: transparent; color: rgba(202,191,176,.6);
    border: 1px dashed rgba(255,255,255,.12); border-radius: 10px;
    font-size: 12px; padding: 9px; cursor: pointer;
  }
</style>
</head>
<body>
  <div id="app" data-mode="splitprev">
    <div class="topbar">
      <div class="brand"><span class="dot"></span> <span class="label">Ao vivo</span></div>
      <div class="modes">
        <button data-mode="split">Roteiro+Chat</button>
        <button data-mode="splitprev" class="active">+ Preview</button>
        <button data-mode="splitfloat">+ Flutuante</button>
        <button data-mode="roteiro">Roteiro</button>
        <button data-mode="chat">Chat</button>
        <button data-mode="live">Live</button>
        <button data-mode="pontos">Pontos</button>
      </div>
    </div>

    <div class="content">
      <div id="roteiro"></div>
      <div class="divider"></div>
      <div id="chatBox">
        <div id="miniLive">
          <span class="livebadge"><span class="dot"></span> Live</span>
          <div id="miniSlot" class="slot"></div>
        </div>
        <div id="chatInner">
          <span class="chatlabel">Chat ao vivo</span>
          <iframe id="chat" allow="autoplay" referrerpolicy="no-referrer"></iframe>
        </div>
      </div>
      <div id="liveBox"><div id="fullSlot" class="slot"></div></div>

      <!-- PLACAR / RANKING -->
      <div id="pontosBox">
        <div class="pt-inner">
          <h2 class="pt-h">Desafios dos 60 pontos</h2>

          <div class="desafio">
            <div class="d-nome">1. Ligar para alguém e agradecer</div>
            <div class="opts" data-d="0">
              <button data-v="0">0</button>
              <button data-v="20">20 · agradeceu</button>
            </div>
          </div>

          <div class="desafio">
            <div class="d-nome">2. Fazer alguém sorrir em 1 min</div>
            <div class="opts" data-d="1">
              <button data-v="0">0</button>
              <button data-v="5">5 · cócegas</button>
              <button data-v="20">20 · falando</button>
            </div>
          </div>

          <div class="desafio">
            <div class="d-nome">3. Tentar ouvir "eu te amo"</div>
            <div class="opts" data-d="2">
              <button data-v="-10">-10</button>
              <button data-v="5">5 · pediu</button>
              <button data-v="10">10 · falou 1º</button>
              <button data-v="20">20 · sem pedir</button>
            </div>
          </div>

          <div class="subtotal">Soma dos desafios: <b id="subDesafios">0</b> pts</div>

          <h2 class="pt-h">4. Multiplicador — prancha baixa</h2>
          <div class="crono">
            <div class="crono-time" id="cronoTime">0.0s</div>
            <div class="crono-btns">
              <button id="cronoStart">▶ Iniciar</button>
              <button id="cronoReset">Zerar</button>
            </div>
            <label class="seg-lbl">segundos na prancha
              <input id="segundos" type="number" inputmode="decimal" min="0" step="0.1" value="0">
            </label>
          </div>

          <div class="final">
            <div class="final-calc" id="finalCalc">0 × 0s</div>
            <div class="final-num" id="finalNum">0</div>
            <div class="final-lbl">pontos finais</div>
          </div>

          <div class="salvar-row">
            <input id="nomeJog" type="text" value="Joel" placeholder="Nome">
            <button id="salvarRanking">Salvar no ranking</button>
          </div>

          <h2 class="pt-h">Ranking</h2>
          <div id="rankingList"></div>

          <button class="reset" id="resetPontos">Zerar desafios deste episódio</button>
        </div>
      </div>
    </div>

    <!-- PLAYER FLUTUANTE (arraste pela barrinha de cima) -->
    <div id="floatLive">
      <div class="float-bar">
        <span class="livebadge"><span class="dot"></span> Live</span>
        <button class="float-close" title="Fechar">✕</button>
      </div>
      <div id="floatSlot" class="slot"></div>
    </div>

    <!-- ÚNICO player da live: fica sempre carregado e é reposicionado sobre o slot
         da view ativa, então trocar de aba NÃO recarrega (sem play/anúncio de novo) -->
    <iframe id="livePlayer" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
  </div>

  <script>
    // ================== CHAT ==================
    const CHAT_URL = "https://botrix.live/widgets/chat/?bid=nAk3QwId7JLqcNfOeaLYkA&theme=transparent&messageSound=0&messageDirection=up&platformIcon=false&bots=true&emojis=true&hideCommands=false&hideMessages=false&hideMessagesSeconds=15&widgetSize=21&streamTogether=true&cheer=true&pointsReward=true&animation=popIn&showTimestamp=false&shadowThickness=5&twitch=true&youtube=true&kick=true&trovo=false";
    document.getElementById('chat').src = CHAT_URL;

    // ================== ROTEIRO (EDITE AQUI) ==================
    // Cada bloco tem um título e uma lista de itens.
    // Coloque "?" no começo de um item pra marcá-lo como PERGUNTA (ganha o ❓).
    const ROTEIRO = [
      { bloco: "Depois do Te Amo: com meu Pai (Joel Kriger)", itens: [
        "#!Subiu o Everest depois dos 68",
      ]},
      { bloco: "Aquece (quem é ele)", itens: [
        "1. Pai, se apresenta pra quem tá chegando agora: quem é o Joel Kriger?",
        "2. Antes de tudo isso — Everest, Canal da Mancha — você sempre foi esse cara de desafio? Como era o Joel mais novo?",
      ]},
      { bloco: "O sonho", itens: [
        "Qual foi o maior desafios que você já realizou?",
        "3. Depois de já ter escalado o Everest, o que te fez olhar pro mar e pensar \"quero atravessar o Canal da Mancha\"?",
        "4. O que essa travessia significa pra você? Por que ela?",
        "5. Muita gente comenta \"na idade dele isso é loucura\". O que você responde pra essa gente?",
      ]},
      { bloco: "A preparação", itens: [
        "6. Como foi treinar pra isso? Quanto tempo, e como se prepara o corpo — e a cabeça — pra 3,5km em água gelada?",
        "7. Alguém tentou te convencer a não fazer? Como é lidar com o medo de quem te ama?",
      ]},
      { bloco: "A logística — as perguntas que a internet mais fez", itens: [
        "8. [🔥 audiência] Por que a travessia é de noite? Por que não de dia, pra pegar menos frio?",
        "9. [🔥 audiência] Qual era a temperatura da água? Como o corpo aguenta aquilo?",
        "10. [🔥 audiência] E aquela substância branca no seu corpo — o que é e pra que serve?",
      ]},
      { bloco: "Dentro da água", itens: [
        "11. Conta o instante de entrar na água, no escuro. Qual foi o primeiro pensamento?",
        "12. Nadando sozinho, no meio do mar, de madrugada — o que passa na cabeça de um homem ali?",
        "13. O que foi mais difícil: o frio, a distância ou a mente?",
        "14. [🔥 audiência] Chegou a tontura. Conta o que você sentiu quando entendeu que ia ter que parar.",
        "15. Teve um segundo em que você pensou em desistir? O que te segurou até os 3,5km?",
      ]},
      { bloco: "A emoção pai e filho", itens: [
        "16. Eu tava ali te filmando, te chamando de \"papai\". O que foi ter seu filho do teu lado nessa hora?",
        "17. O que a gente aprendeu um com o outro nessa travessia?",
      ]},
      { bloco: "Depois / a próxima", itens: [
        "18. Você parou nos 3,5km e a internet inteira te chamou de campeão. Como é ser vencedor mesmo sem \"completar\"?",
        "19. Por que a próxima só em 2029? O que vai ser diferente — e o que te dá certeza de que dessa vez vai?",
      ]},
      { bloco: "O fecho (a mensagem)", itens: [
        "20. Pra fechar: que recado o Joel deixa pra quem acha que já passou da idade de sonhar? E depois do Everest e do Canal… qual sonho ainda falta?",
      ]},
      { bloco: "Ranking", itens: [
        "#!Fran: 4700",
        "#!Celso: 9100",
      ]},
      { bloco: "Desafios dos 60 pontos", itens: [
        "1. Ligar para alguém importante e agradecer",
        "#Valendo 20 pontos:",
        "#0 pontos: não conseguir",
        "#20 pontos: ligar e agradecer",
        "2. Fazer alguém sorrir em até 1 minuto",
        "#Valendo 20 pontos:",
        "#0 pontos: não conseguir",
        "#5 pontos: fazer cócegas",
        "#20 pontos: só falando ou fazendo algo em 1 minuto",
        "3. Ligar para alguém e tentar ouvir \"eu te amo\"",
        "#Valendo 20 pontos:",
        "#-10 pontos: Não conseguir ouvir um te amo",
        "#5 pontos: Pedir",
        "#10 pontos: Falar primeiro",
        "#20 pontos: Não pedir",
        "4. Multiplicador",
        "#Multiplicar os pontos pelos segundos que ficou na prancha baixa.",
      ]},
      { bloco: "Parabéns!!", itens: [
        "#!🎉 Parabéns!!",
      ]},
    ];

    // ================== render + estado ==================
    const KEY = "ddta-roteiro-v1";
    let done = {};
    try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { done = {}; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

    const root = document.getElementById('roteiro');
    function render() {
      root.innerHTML = "";
      ROTEIRO.forEach(function (b, bi) {
        const sec = document.createElement('div');
        sec.className = 'bloco';
        const h = document.createElement('h2');
        h.textContent = b.bloco;
        sec.appendChild(h);
        b.itens.forEach(function (raw, ii) {
          // linha começando com "#" = nota (sem caixa). "#!" = nota em destaque.
          if (raw.charAt(0) === '#') {
            const forte = raw.charAt(1) === '!';
            const n = document.createElement('div');
            n.className = 'note' + (forte ? ' forte' : '');
            n.textContent = (forte ? raw.slice(2) : raw.slice(1)).trim();
            sec.appendChild(n);
            return;
          }
          const isQ = raw.charAt(0) === '?';
          const txt = isQ ? raw.slice(1).trim() : raw;
          const id = bi + '-' + ii;
          const el = document.createElement('div');
          el.className = 'item' + (isQ ? ' pergunta' : '') + (done[id] ? ' done' : '');
          el.innerHTML = '<span class="box"></span><span class="txt"></span>';
          el.querySelector('.txt').textContent = txt;
          el.addEventListener('click', function () {
            done[id] = !done[id];
            el.classList.toggle('done', !!done[id]);
            save();
          });
          sec.appendChild(el);
        });
        root.appendChild(sec);
      });
      const btn = document.createElement('button');
      btn.className = 'reset';
      btn.textContent = 'Desmarcar tudo';
      btn.addEventListener('click', function () { done = {}; save(); render(); });
      root.appendChild(btn);
    }
    render();

    // ================== divisória arrastável ==================
    const app = document.getElementById('app');
    const divider = document.querySelector('.divider');
    const content = document.querySelector('.content');
    const SPLITKEY = "ddta-split-v1";
    const savedSplit = localStorage.getItem(SPLITKEY);
    if (savedSplit) app.style.setProperty('--split', savedSplit);

    let dragging = false;
    function applyY(clientY) {
      const r = content.getBoundingClientRect();
      let frac = (clientY - r.top) / r.height * 100;
      frac = Math.max(15, Math.min(85, frac));   // não deixa nenhum lado sumir
      app.style.setProperty('--split', frac.toFixed(1) + '%');
    }
    divider.addEventListener('pointerdown', function (e) {
      dragging = true;
      divider.classList.add('dragging');
      app.classList.add('resizing');
      try { divider.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    divider.addEventListener('pointermove', function (e) { if (dragging) { applyY(e.clientY); positionPlayer(); } });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      divider.classList.remove('dragging');
      app.classList.remove('resizing');
      try { localStorage.setItem(SPLITKEY, app.style.getPropertyValue('--split')); } catch (err) {}
    }
    divider.addEventListener('pointerup', endDrag);
    divider.addEventListener('pointercancel', endDrag);

    // ================== preview da LIVE (Twitch) ==================
    const TWITCH_CHANNEL = "nextleveldj";
    const LIVE_PARENTS = ["ilankriger-gmail.github.io", "localhost", "127.0.0.1"];
    function liveUrl() {
      const parents = LIVE_PARENTS.map(function (h) { return "parent=" + h; }).join("&");
      return "https://player.twitch.tv/?channel=" + TWITCH_CHANNEL +
             "&" + parents + "&muted=true&autoplay=true";
    }
    const player = document.getElementById('livePlayer');
    const miniSlot = document.getElementById('miniSlot');
    const fullSlot = document.getElementById('fullSlot');
    const floatSlot = document.getElementById('floatSlot');
    player.src = liveUrl();          // carrega UMA vez e nunca mais recarrega

    // reposiciona o player único por cima do slot da view ativa (sem recarregar).
    // Nas views sem vídeo ele só fica escondido (continua carregado por baixo).
    // manda o player pra fora da tela SEM esconder (display:block) — assim ele
    // continua rodando/carregado e nunca recarrega ou roda anúncio de novo.
    function parkPlayer() {
      player.style.display = 'block';
      player.style.pointerEvents = 'none';
      player.style.left = '-100000px';
      player.style.top = '0px';
      player.style.width = '320px';
      player.style.height = '180px';
    }
    function positionPlayer() {
      const mode = app.getAttribute('data-mode');
      let slot = null;
      if (mode === 'live') slot = fullSlot;
      else if (mode === 'splitprev') slot = miniSlot;
      else if (mode === 'splitfloat') slot = floatSlot;
      if (!slot) { parkPlayer(); return; }
      const r = slot.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) { parkPlayer(); return; }
      player.style.display = 'block';
      player.style.pointerEvents = '';
      player.style.left = r.left + 'px';
      player.style.top = r.top + 'px';
      player.style.width = r.width + 'px';
      player.style.height = r.height + 'px';
    }
    addEventListener('resize', positionPlayer);
    addEventListener('orientationchange', positionPlayer);
    addEventListener('load', positionPlayer);

    // ================== modos (views) ==================
    document.querySelectorAll('.modes button').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('.modes button').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        app.setAttribute('data-mode', b.getAttribute('data-mode'));
        positionPlayer();
      });
    });

    // ================== player flutuante (arrastável) ==================
    const floatBox = document.getElementById('floatLive');
    const FLOATKEY = "ddta-floatpos-v1";
    (function () {
      try {
        const p = JSON.parse(localStorage.getItem(FLOATKEY) || "null");
        if (p) { floatBox.style.left = p.left; floatBox.style.top = p.top; floatBox.style.right = "auto"; }
      } catch (e) {}
    })();
    // o ✕ do flutuante volta pra view "Roteiro+Chat"
    floatBox.querySelector('.float-close').addEventListener('click', function () {
      document.querySelectorAll('.modes button').forEach(function (x) {
        x.classList.toggle('active', x.getAttribute('data-mode') === 'split');
      });
      app.setAttribute('data-mode', 'split');
      positionPlayer();
    });

    // arrastar o flutuante pela barrinha
    const fbar = floatBox.querySelector('.float-bar');
    let fdrag = false, fdx = 0, fdy = 0;
    fbar.addEventListener('pointerdown', function (e) {
      fdrag = true;
      app.classList.add('resizing');
      const r = floatBox.getBoundingClientRect();
      fdx = e.clientX - r.left; fdy = e.clientY - r.top;
      floatBox.style.right = "auto";
      try { fbar.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    fbar.addEventListener('pointermove', function (e) {
      if (!fdrag) return;
      let x = e.clientX - fdx, y = e.clientY - fdy;
      x = Math.max(4, Math.min(innerWidth - floatBox.offsetWidth - 4, x));
      y = Math.max(4, Math.min(innerHeight - floatBox.offsetHeight - 4, y));
      floatBox.style.left = x + "px"; floatBox.style.top = y + "px";
      positionPlayer();
    });
    function endFdrag() {
      if (!fdrag) return;
      fdrag = false;
      app.classList.remove('resizing');
      try { localStorage.setItem(FLOATKEY, JSON.stringify({ left: floatBox.style.left, top: floatBox.style.top })); } catch (e) {}
    }
    fbar.addEventListener('pointerup', endFdrag);
    fbar.addEventListener('pointercancel', endFdrag);

    // ================== PLACAR ==================
    const PTKEY = "ddta-pontos-v1";
    const RKKEY = "ddta-ranking-v1";
    let sel = [null, null, null];           // ponto escolhido em cada desafio
    let segundos = 0;
    let ranking = [{ nome: "Fran", pts: 4700 }, { nome: "Celso", pts: 9100 }];
    let ultimoSalvo = null;
    try { const s = JSON.parse(localStorage.getItem(PTKEY) || "null"); if (s) { sel = s.sel || sel; segundos = s.segundos || 0; } } catch (e) {}
    try { const r = JSON.parse(localStorage.getItem(RKKEY) || "null"); if (r && r.length) ranking = r; } catch (e) {}

    const subEl = document.getElementById('subDesafios');
    const finalCalc = document.getElementById('finalCalc');
    const finalNum = document.getElementById('finalNum');
    const segInput = document.getElementById('segundos');

    function subtotal() { return sel.reduce(function (a, v) { return a + (v || 0); }, 0); }
    function finalPts() { return Math.round(subtotal() * (segundos > 0 ? segundos : 1)); }
    function savePt() { try { localStorage.setItem(PTKEY, JSON.stringify({ sel: sel, segundos: segundos })); } catch (e) {} }
    function saveRk() { try { localStorage.setItem(RKKEY, JSON.stringify(ranking)); } catch (e) {} }

    function renderPontos() {
      document.querySelectorAll('.opts').forEach(function (grp) {
        const d = +grp.getAttribute('data-d');
        grp.querySelectorAll('button').forEach(function (btn) {
          btn.classList.toggle('sel', sel[d] !== null && +btn.getAttribute('data-v') === sel[d]);
        });
      });
      subEl.textContent = subtotal();
      const mult = segundos > 0 ? segundos : 1;
      finalCalc.textContent = subtotal() + " × " + (segundos > 0 ? segundos + "s" : "1 (sem prancha)");
      finalNum.textContent = finalPts();
    }

    document.querySelectorAll('.opts').forEach(function (grp) {
      const d = +grp.getAttribute('data-d');
      grp.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const v = +btn.getAttribute('data-v');
          sel[d] = (sel[d] === v) ? null : v;   // toca de novo pra desmarcar
          savePt(); renderPontos();
        });
      });
    });
    segInput.value = segundos || 0;
    segInput.addEventListener('input', function () {
      segundos = parseFloat(segInput.value) || 0; savePt(); renderPontos();
    });

    // cronômetro da prancha
    const cronoTime = document.getElementById('cronoTime');
    const cronoStart = document.getElementById('cronoStart');
    let cRun = false, cStart = 0, cInt = null;
    function cShow(ms) { cronoTime.textContent = (ms / 1000).toFixed(1) + "s"; }
    cronoStart.addEventListener('click', function () {
      if (!cRun) {
        cRun = true; cStart = Date.now();
        cronoStart.classList.add('running'); cronoStart.textContent = "⏸ Parar";
        cInt = setInterval(function () { cShow(Date.now() - cStart); }, 100);
      } else {
        cRun = false; clearInterval(cInt);
        cronoStart.classList.remove('running'); cronoStart.textContent = "▶ Iniciar";
        const secs = (Date.now() - cStart) / 1000;
        segundos = Math.round(secs * 10) / 10; segInput.value = segundos;
        savePt(); renderPontos();
      }
    });
    document.getElementById('cronoReset').addEventListener('click', function () {
      cRun = false; clearInterval(cInt); cronoStart.classList.remove('running'); cronoStart.textContent = "▶ Iniciar";
      cShow(0); segundos = 0; segInput.value = 0; savePt(); renderPontos();
    });

    // ranking
    const rankingList = document.getElementById('rankingList');
    const nomeJog = document.getElementById('nomeJog');
    const medals = ["🥇", "🥈", "🥉"];
    function renderRanking() {
      const ord = ranking.slice().sort(function (a, b) { return b.pts - a.pts; });
      rankingList.innerHTML = "";
      ord.forEach(function (r, i) {
        const row = document.createElement('div');
        row.className = 'rk' + (r.nome === ultimoSalvo ? ' novo' : '');
        row.innerHTML = '<span class="pos"></span><span class="nome"></span><span class="pts"></span><button class="del" title="Remover">✕</button>';
        row.querySelector('.pos').textContent = medals[i] || (i + 1) + "º";
        row.querySelector('.nome').textContent = r.nome;
        row.querySelector('.pts').textContent = r.pts.toLocaleString('pt-BR');
        row.querySelector('.del').addEventListener('click', function () {
          ranking = ranking.filter(function (x) { return x !== r; }); saveRk(); renderRanking();
        });
        rankingList.appendChild(row);
      });
    }
    document.getElementById('salvarRanking').addEventListener('click', function () {
      const nome = (nomeJog.value || "").trim(); if (!nome) return;
      const pts = finalPts();
      const existe = ranking.find(function (x) { return x.nome.toLowerCase() === nome.toLowerCase(); });
      if (existe) existe.pts = pts; else ranking.push({ nome: nome, pts: pts });
      ultimoSalvo = nome; saveRk(); renderRanking();
    });
    document.getElementById('resetPontos').addEventListener('click', function () {
      sel = [null, null, null]; segundos = 0; segInput.value = 0; cShow(0); savePt(); renderPontos();
    });

    renderPontos(); renderRanking();
    positionPlayer();                              // posição inicial
    requestAnimationFrame(positionPlayer);         // reposiciona após o layout assentar
  </script>
</body>
</html>
