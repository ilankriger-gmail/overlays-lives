<style>
/*
  Estilo compartilhado das cenas de live (comecando / javolto / encerrada / conexao-perdida).
  HTML + CSS puro — so animacao em @keyframes. Leve, nao trava o OBS.

  Cada cena sobrescreve as variaveis :root abaixo no <style> do proprio index.html.
  Mudou algo aqui? Rode `node overlays/build.js` pra regerar as versoes arquivo-unico.
*/
:root {
  --accent: #a78bfa;
  --bg: #0b0712;
  --bar: #7c3aed;
  --title-size: 152px;
  --panel-bg: rgba(255,255,255,.05);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg); overflow: hidden;
  font-family: 'Bricolage Grotesque', sans-serif;
}
#stage {
  position: absolute; top: 50%; left: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center center;
  background: var(--bg); overflow: hidden;
}
.glow { position: absolute; border-radius: 50%; pointer-events: none; }
.glow--1 {
  left: -12%; top: -18%; width: 760px; height: 760px;
  background: radial-gradient(circle at 45% 45%, rgba(124,58,237,.5), transparent 62%);
  filter: blur(20px); animation: glowPulse 8s ease-in-out infinite;
}
.glow--2 {
  right: 10%; bottom: -22%; width: 620px; height: 620px;
  background: radial-gradient(circle at 50% 50%, rgba(168,85,247,.3), transparent 62%);
  filter: blur(26px); animation: glowPulse2 8s ease-in-out infinite; animation-delay: -1.9s;
}
@keyframes glowPulse  { 0%{opacity:.5}  25%{opacity:.85} 50%{opacity:.5}  75%{opacity:.15} 100%{opacity:.5}  }
@keyframes glowPulse2 { 0%{opacity:.45} 25%{opacity:.75} 50%{opacity:.45} 75%{opacity:.15} 100%{opacity:.45} }

.topbar {
  position: absolute; top: 0; left: 0; right: 0; height: 64px;
  background: var(--bar); display: flex; align-items: center; overflow: hidden;
}
.marquee {
  display: flex; white-space: nowrap; will-change: transform;
  /* Velocidade da barra de cima. Maior = mais devagar. */
  animation: marquee 30s linear infinite;
}
.marquee span {
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: 26px;
  letter-spacing: 0.18em; color: #ede4ff;
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.main {
  position: absolute; top: 64px; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: 70px; padding: 0 80px;
}
.left { flex: 1; min-width: 0; }

.eyebrow-row { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
.eyebrow {
  font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600;
  letter-spacing: 0.3em; color: var(--accent); text-transform: uppercase;
}
.dot {
  width: 13px; height: 13px; border-radius: 50%; background: var(--accent);
  flex: none; animation: dotPulse 2s ease-in-out infinite;
}
.dot--ring { animation: dotPulse 2s ease-in-out infinite, ring 2s linear infinite; }
@keyframes dotPulse {
  0%{transform:scale(1)} 25%{transform:scale(1.13)} 50%{transform:scale(1)}
  75%{transform:scale(0.87)} 100%{transform:scale(1)}
}
@keyframes ring {
  0%{box-shadow:0 0 0 0 rgba(124,58,237,.5)} 100%{box-shadow:0 0 0 12px rgba(124,58,237,0)}
}

.title {
  margin: 0; font-weight: 800; font-size: var(--title-size);
  line-height: 0.92; color: #fff; letter-spacing: -0.03em;
}
.title .accent { color: var(--accent); }
.title span.line { display: block; }
.subtitle {
  margin: 28px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px;
  font-weight: 500; color: #c4b5e8; line-height: 1.4; max-width: 620px;
}

.handle {
  margin-top: 46px; display: inline-flex; align-items: center; gap: 16px;
  padding: 14px 28px 14px 14px; border-radius: 100px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(167,139,250,.35);
}
.handle__avatar {
  width: 52px; height: 52px; border-radius: 50%; overflow: hidden;
  background: #1a0f2e; border: 2px solid rgba(167,139,250,.6); flex: none;
}
.handle__avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.handle__name { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600; color: #fff; }

/* painel do chat: caixa limpa (sem cabecalho), pra sobrepor o chat transparente */
.panel {
  flex: none; width: 540px; height: calc(100% - 96px); margin: 48px 0;
  border-radius: 22px; background: var(--panel-bg);
  border: 1px solid rgba(167,139,250,.26); overflow: hidden;
}
</style>
<style>
  /* Ajustes so desta cena */
  :root {
    --title-size: 152px;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="glow glow--1"></div>
    <div class="glow glow--2"></div>

    <div class="topbar">
      <div class="marquee">
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="main">
      <div class="left">
        <div class="eyebrow-row">
          <span class="dot dot--ring"></span>
          <span class="eyebrow">Volto num instante</span>
        </div>

        <h1 class="title"><span class="line">Já <span class="accent">volto!</span></span></h1>

  <script>
    // ==== EDITE AQUI: textos que rodam na barra do topo ====
    var MARQUEE_ITEMS = ['@NEXTLEVELDJ', 'AO VIVO'];

    // Monta o letreiro com gaps que nao colapsam (\u00A0 = nbsp) e repete pra encher a barra.
    var GAP = '\u00A0\u00A0\u00A0';
    var unidade = MARQUEE_ITEMS.map(function (t) { return t + GAP + '•' + GAP; }).join('');
    document.querySelectorAll('.marquee span').forEach(function (el) {
      el.textContent = unidade.repeat(4);
    });

    // Ajusta o palco 1920x1080 ao tamanho da janela.
    var stage = document.getElementById('stage');
    function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
    addEventListener('resize', fit); fit();
