<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Overlay de exemplo</title>
<style>
  /* IMPORTANTE: fundo transparente pro Browser Source do OBS deixar a câmera/jogo aparecer atrás. */
  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Moldura animada ao redor da tela */
  .frame {
    position: absolute;
    inset: 24px;
    border: 4px solid rgba(108, 140, 255, 0.9);
    border-radius: 22px;
    box-shadow: 0 0 30px rgba(108, 140, 255, 0.45), inset 0 0 40px rgba(108, 140, 255, 0.12);
    animation: glow 3s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 24px rgba(108,140,255,.35), inset 0 0 30px rgba(108,140,255,.10); }
    50%      { box-shadow: 0 0 48px rgba(108,140,255,.75), inset 0 0 50px rgba(108,140,255,.20); }
  }

  /* Selo AO VIVO pulsando (canto superior esquerdo) */
  .live {
    position: absolute;
    top: 48px; left: 56px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(13, 15, 20, 0.78);
    backdrop-filter: blur(8px);
    padding: 14px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.08);
  }
  .dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: #f8333c;
    box-shadow: 0 0 0 0 rgba(248, 51, 60, 0.7);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(248,51,60,.7); }
    70%  { box-shadow: 0 0 0 18px rgba(248,51,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(248,51,60,0); }
  }
  .live span { color: #fff; font-weight: 800; letter-spacing: 3px; font-size: 26px; }

  /* Lower-third com nome */
  .lower {
    position: absolute;
    left: 56px; bottom: 64px;
    background: linear-gradient(90deg, rgba(75,107,255,.95), rgba(108,140,255,.85));
    padding: 18px 34px;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    transform: translateX(-120%);
    animation: slidein .8s cubic-bezier(.2,.9,.2,1) .4s forwards;
  }
  .lower .title { color: #fff; font-size: 40px; font-weight: 800; line-height: 1; }
  .lower .subtitle { color: rgba(255,255,255,.85); font-size: 20px; margin-top: 6px; }
  @keyframes slidein { to { transform: translateX(0); } }
</style>
</head>
<body>
  <div class="frame"></div>

  <div class="live">
    <div class="dot"></div>
    <span>AO VIVO</span>
  </div>

  <div class="lower">
    <div class="title">Seu Nome Aqui</div>
    <div class="subtitle">overlay de exemplo · edite este HTML</div>
  </div>
</body>
</html>
