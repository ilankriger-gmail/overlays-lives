<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live - encerrada</title>

<!--
  Overlay "Live - encerrada" — tela cheia 1920x1080 pra usar no OBS.
  Estilo compartilhado em ../overlay.css; fontes embutidas em ../assets/fonts.css (funciona offline).
  Pra trocar o @ ou textos, edite abaixo (o letreiro do topo fica no <script> no fim).
  Mudou algo? Rode `node overlays/build.js` pra regerar a versao arquivo-unico (../encerrada.html).
-->

<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../overlay.css">
<style>
  /* Ajustes so desta cena */
  :root {
    --bg: #09060f;
    --bar: #5b2bb0;
    --title-size: 132px;
    --panel-bg: rgba(255,255,255,.04);
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="glow glow--1"></div>
    <div class="glow glow--2"></div>

    <div class="topbar">
      <div class="marquee">
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="main">
      <div class="left">
        <div class="eyebrow-row">
          <span class="dot dot--ring"></span>
          <span class="eyebrow">Por hoje é isso</span>
        </div>

        <h1 class="title"><span class="line">Live <span class="accent">encerrada</span></span></h1>

        <p class="subtitle">Valeu demais por assistir! Já já tem mais — te vejo na próxima.</p>

        <div class="handle">
          <div class="handle__avatar"><img src="../assets/avatar.png" alt=""></div>
          <span class="handle__name">@nextleveldj</span>
        </div>
      </div>

      <!-- area livre pro seu chat transparente (outro Browser Source por cima) -->
      <div class="panel"></div>
    </div>
  </div>

  <script>
    // ==== EDITE AQUI: textos que rodam na barra do topo ====
    var MARQUEE_ITEMS = ['OBRIGADO POR COLAR', '@NEXTLEVELDJ', 'ATÉ A PRÓXIMA'];

    // Monta o letreiro com gaps que nao colapsam (\u00A0 = nbsp) e repete pra encher a barra.
    var GAP = '\u00A0\u00A0\u00A0';
    var unidade = MARQUEE_ITEMS.map(function (t) { return t + GAP + '•' + GAP; }).join('');
    document.querySelectorAll('.marquee span').forEach(function (el) {
      el.textContent = unidade.repeat(4);
    });

    // Ajusta o palco 1920x1080 ao tamanho da janela.
    var stage = document.getElementById('stage');
    function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
    addEventListener('resize', fit); fit();
  </script>
</body>
</html>
