<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depois do Te Amo — durante a live (Samuel · Tatuagem falsa)</title>

<!--
  Inspirado no durante.html (edição da Fran): overlay TRANSPARENTE pra ficar POR
  CIMA da câmera durante a live inteira. Mesma ideia de aparecer de vez em quando
  e some por muito tempo (tela limpa), mesma zona segura central-baixa.

  Diferença: aqui é UMA thumb só — um SELO/CARIMBO circular que fica GIRANDO.
  Ele sobe girando, fica ~10s e SOME por ~110s. Episódio: Samuel · "Tatuagem falsa".

  DUPLA TRANSMISSÃO (horizontal + vertical): a thumb vive na "zona segura" central
  (--safe), então sobrevive ao corte 9:16 do meio da tela.

  No OBS: Browser Source 1920x1080, fundo transparente (não marque "cor de fundo"),
  este source ACIMA da câmera. Pra trocar textos, edite os blocos lá embaixo.
  Pra aparecer mais/menos vezes, mude --loop. Pra girar mais rápido, diminua --spin.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Noto+Color+Emoji&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --tinta: #17130f;
    --amarelo: #ffd23a;
    --laranja: #ff8a2e;
    --vermelho: #e8420e;
    --apagado: #5a4a3a;
    --cinza: #cabfb0;
    /* Zona segura central (corte vertical 9:16 de 1080 ≈ 608px). */
    --safe: 600px;
    /* Ciclo completo: thumb aparece ~10s e some por ~110s de TELA LIMPA.
       Aumente pra espaçar ainda mais. */
    --loop: 120s;
    /* Tempo de uma volta completa do selo (menor = gira mais rápido). */
    --spin: 12s;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent;          /* TRANSPARENTE: mostra a câmera atrás */
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
  }
  #stage {
    position: absolute; top: 50%; left: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    transform-origin: center center;
    background: transparent; overflow: hidden;
  }

  /* área central-baixa onde a thumb aparece (dentro da zona segura) */
  .thumb-wrap {
    position: absolute; left: 50%; bottom: 90px;
    transform: translateX(-50%);
    width: 100%; max-width: var(--safe);
    display: flex; justify-content: center;
    pointer-events: none;
  }

  /* .thumb controla o APARECER/SUMIR (loop bem espaçado, igual ritmo do da Fran) */
  .thumb {
    position: relative;
    width: 480px; height: 480px;
    opacity: 0;                       /* começa escondida; keyframes controlam */
    transform: scale(.82);
    animation: thumbShow var(--loop) linear infinite;
    filter: drop-shadow(0 18px 44px rgba(0,0,0,.45))
            drop-shadow(0 0 40px rgba(232,66,14,.22));
  }
  /* Num ciclo de 120s: aparece 0–10s, some o resto. Bem esparso. */
  @keyframes thumbShow {
    0%    { opacity: 0; transform: scale(.82); }
    1.2%  { opacity: 1; transform: scale(1.05); }
    2.4%  { opacity: 1; transform: scale(1); }
    7.5%  { opacity: 1; transform: scale(1); }
    8.6%  { opacity: 0; transform: scale(.92); }
    100%  { opacity: 0; transform: scale(.92); }
  }

  /* .spin: gira pra sempre (fica "girando") */
  .spin {
    position: absolute; inset: 0;
    animation: girar var(--spin) linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  .spin svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .ring-text {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 21px; letter-spacing: 1.5px;
    fill: var(--amarelo);
  }

  /* NÚCLEO fixo no centro — não gira, fica legível */
  .core {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 4px; padding: 0 96px;
  }

  /* logo — reticências antes do coração em chamas (igual identidade do da Fran) */
  .logo {
    transform: rotate(-2.5deg);
    font-family: 'Luckiest Guy', sans-serif; text-transform: uppercase; line-height: .9;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .logo__top {
    font-size: 24px; color: var(--amarelo);
    text-shadow: 3px 3px 0 rgba(232,66,14,.55);
  }
  .logo__teamo {
    font-size: 76px; color: #fff; white-space: nowrap;
    text-shadow: 4px 6px 0 var(--vermelho);
  }
  .dots { display: inline-flex; align-items: center; gap: 12px; margin-top: 2px; }
  .d { border-radius: 50%; display: inline-block; }
  .d1 { width: 13px; height: 13px; animation: acende1 3.2s ease-in-out infinite; }
  .d2 { width: 17px; height: 17px; animation: acende2 3.2s ease-in-out infinite; }
  .heart {
    font-family: 'Noto Color Emoji', emoji; font-size: 40px; line-height: 1;
    display: inline-block; animation: flare 3.2s ease-in-out infinite;
  }
  @keyframes acende1 {
    0%, 8%   { background: var(--apagado); box-shadow: none; }
    18%, 82% { background: var(--laranja); box-shadow: 0 0 16px rgba(255,138,46,.85); }
    94%,100% { background: var(--apagado); box-shadow: none; }
  }
  @keyframes acende2 {
    0%, 24%  { background: var(--apagado); box-shadow: none; }
    34%, 82% { background: var(--amarelo); box-shadow: 0 0 20px rgba(255,210,58,.85); }
    94%,100% { background: var(--apagado); box-shadow: none; }
  }
  @keyframes flare {
    0%, 38%  { transform: scale(1) rotate(0deg); filter: none; }
    50%      { transform: scale(1.16) rotate(-4deg); filter: drop-shadow(0 0 18px rgba(255,138,46,.9)); }
    62%      { transform: scale(1.06) rotate(3deg); filter: drop-shadow(0 0 12px rgba(255,138,46,.7)); }
    76%, 100%{ transform: scale(1) rotate(0deg); filter: none; }
  }

  /* divisor de fogo */
  .divisor {
    width: 120px; height: 3px; margin: 12px 0 8px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--laranja), var(--vermelho), var(--laranja), transparent);
  }

  /* episódio deste programa */
  .ep {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    color: var(--cinza); font-size: 18px; letter-spacing: .08em; text-transform: uppercase;
  }
  .ep b { color: var(--amarelo); font-weight: 700; }
  .ep-titulo {
    font-family: 'Luckiest Guy', sans-serif; text-transform: uppercase;
    color: #fff; font-size: 34px; line-height: .95; margin-top: 3px;
    text-shadow: 3px 4px 0 var(--vermelho); transform: rotate(-1.5deg);
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="thumb-wrap">

      <div class="thumb">
        <!-- SELO que gira: aro de fogo + a frase que explica o programa correndo em volta -->
        <div class="spin">
          <svg viewBox="0 0 480 480">
            <defs>
              <linearGradient id="fogo" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0"   stop-color="#ffd23a"/>
                <stop offset=".5"  stop-color="#ff8a2e"/>
                <stop offset="1"   stop-color="#e8420e"/>
              </linearGradient>
              <!-- caminho circular pro texto correr em volta -->
              <path id="aro" fill="none"
                    d="M 240,240 m -200,0 a 200,200 0 1,1 400,0 a 200,200 0 1,1 -400,0"/>
            </defs>

            <!-- anel de fogo (traço pontilhado + traço cheio) -->
            <circle cx="240" cy="240" r="228" fill="none"
                    stroke="url(#fogo)" stroke-width="6"
                    stroke-dasharray="3 16" stroke-linecap="round" opacity=".85"/>
            <circle cx="240" cy="240" r="216" fill="none"
                    stroke="url(#fogo)" stroke-width="9" opacity=".9"/>

            <!-- frase que explica o programa, curva e girando junto -->
            <text class="ring-text">
              <textPath href="#aro" startOffset="0">
                CONVERSAS DE VERDADE SOBRE O QUE VEM DEPOIS DO “TE AMO” ✦ VOCÊ ESTÁ ASSISTINDO ✦
              </textPath>
            </text>
          </svg>
        </div>

        <!-- núcleo fixo (não gira): marca clara + episódio -->
        <div class="core">
          <div class="logo">
            <div class="logo__top">Depois do</div>
            <div class="logo__teamo">te amo</div>
            <div class="dots">
              <span class="d d1"></span>
              <span class="d d2"></span>
              <span class="heart">❤️‍🔥</span>
            </div>
          </div>

          <div class="divisor"></div>

          <div class="ep">Episódio 02 · <b>Samuel</b></div>
          <div class="ep-titulo">“Tatuagem falsa”</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    var stage = document.getElementById('stage');
    function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
    addEventListener('resize', fit); fit();
  </script>
</body>
</html>
