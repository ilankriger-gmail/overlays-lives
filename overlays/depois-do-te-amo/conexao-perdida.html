<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depois do Te Amo — conexão perdida</title>

<!--
  Overlay "conexão perdida" — Depois do Te Amo · tela cheia 1920x1080 pro OBS.
  O coração fica fraquinho (tentando não apagar) enquanto as reticências
  fazem o "reconectando…". HTML + CSS puro. No OBS: Browser Source 1920x1080.

  DUPLA TRANSMISSÃO (horizontal + vertical): tudo que importa fica dentro da
  "zona segura" central (--safe), pra sobreviver ao corte 9:16 do meio da tela.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Noto+Color+Emoji&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --preto: #0e0e10;
    --tinta: #17130f;
    --amarelo: #ffd23a;
    --laranja: #ff8a2e;
    --vermelho: #e8420e;
    --apagado: #5a4a3a;
    --cinza: #cabfb0;
    /* Zona segura central (recorte vertical 9:16 de 1080 = ~608px). */
    --safe: 600px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--preto); overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
  }
  #stage {
    position: absolute; top: 50%; left: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    transform-origin: center center;
    background: var(--preto); overflow: hidden;
  }

  /* brasas fracas: quase apagando */
  .glow { position: absolute; border-radius: 50%; pointer-events: none; }
  .glow--1 {
    left: -14%; top: -20%; width: 820px; height: 820px;
    background: radial-gradient(circle at 45% 45%, rgba(232,66,14,.2), transparent 62%);
    filter: blur(22px); animation: fraco 5s ease-in-out infinite;
  }
  .glow--2 {
    right: -10%; bottom: -24%; width: 700px; height: 700px;
    background: radial-gradient(circle at 50% 50%, rgba(255,138,46,.14), transparent 62%);
    filter: blur(26px); animation: fraco 5s ease-in-out infinite; animation-delay: -2.2s;
  }
  @keyframes fraco { 0%,100%{opacity:.35} 20%{opacity:.7} 40%{opacity:.25} 60%{opacity:.6} 80%{opacity:.2} }

  .ember {
    position: absolute; bottom: -24px; border-radius: 50%;
    animation: rise linear infinite; pointer-events: none;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: .6; }
    60%  { opacity: .35; }
    100% { transform: translateY(-1180px) translateX(60px); opacity: 0; }
  }

  .main {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; z-index: 1;
    animation: enter .8s ease-out both;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* zona segura: coluna central que sobrevive ao corte vertical */
  .safe {
    width: 100%; max-width: var(--safe); margin: 0 auto; padding: 0 16px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 40px;
  }

  .pill {
    background: var(--amarelo); color: var(--tinta);
    font-weight: 700; font-size: 26px; letter-spacing: .06em;
    padding: 12px 30px; border-radius: 14px; transform: rotate(-2deg);
  }

  .title {
    margin: 0; transform: rotate(-3deg); max-width: 100%;
    font-family: 'Luckiest Guy', sans-serif; font-weight: 400;
    font-size: 116px; line-height: .92; color: #fff; text-transform: uppercase;
    text-shadow: 7px 9px 0 var(--vermelho);
    /* o título dá uma piscada de sinal ruim de vez em quando */
    animation: sinalRuim 6s steps(1) infinite;
  }
  @keyframes sinalRuim {
    0%, 100% { opacity: 1; }
    42% { opacity: 1; } 43% { opacity: .55; } 44% { opacity: 1; }
    46% { opacity: .7; } 47% { opacity: 1; }
    78% { opacity: 1; } 79% { opacity: .6; } 80% { opacity: 1; }
  }

  /* reconectando… */
  .status { display: flex; align-items: center; gap: 20px; transform: rotate(-2deg); }
  .status__text {
    font-size: 28px; font-weight: 600; letter-spacing: .14em;
    color: var(--amarelo); text-transform: uppercase;
  }
  .dots { display: inline-flex; align-items: center; gap: 16px; }
  .d { border-radius: 50%; display: inline-block; }
  .d1 { width: 20px; height: 20px; animation: acende1 1.8s ease-in-out infinite; }
  .d2 { width: 24px; height: 24px; animation: acende2 1.8s ease-in-out infinite; }
  .heart {
    font-family: 'Noto Color Emoji', emoji; font-size: 56px; display: inline-block;
    /* coração fraquinho, tentando não apagar */
    animation: quaseApaga 1.8s ease-in-out infinite;
  }
  @keyframes acende1 {
    0%, 10%  { background: var(--apagado); box-shadow: none; }
    22%, 70% { background: var(--laranja); box-shadow: 0 0 14px rgba(255,138,46,.8); }
    88%,100% { background: var(--apagado); box-shadow: none; }
  }
  @keyframes acende2 {
    0%, 30%  { background: var(--apagado); box-shadow: none; }
    42%, 70% { background: var(--amarelo); box-shadow: 0 0 16px rgba(255,210,58,.8); }
    88%,100% { background: var(--apagado); box-shadow: none; }
  }
  @keyframes quaseApaga {
    0%, 100% { opacity: .45; transform: scale(.96); filter: grayscale(.4); }
    55%      { opacity: 1;   transform: scale(1.05); filter: grayscale(0) drop-shadow(0 0 14px rgba(255,138,46,.7)); }
    70%      { opacity: .8;  transform: scale(1); }
  }

  .subtitle {
    font-size: 28px; font-weight: 500; color: var(--cinza);
    margin: 0; line-height: 1.45;
  }

  .wm {
    position: absolute; left: 50%; bottom: 40px; z-index: 2;
    display: flex; align-items: baseline; transform: translateX(-50%) rotate(-2deg);
  }
  .wm__text {
    font-family: 'Luckiest Guy', sans-serif; font-size: 30px; color: #fff;
    text-transform: uppercase; white-space: nowrap; padding-top: 6px;
    text-shadow: 2px 3px 0 var(--vermelho);
  }
  .wm__dots { display: inline-flex; align-items: baseline; gap: 5px; margin-left: 10px; }
  .wm__dots .p1 { width: 7px; height: 7px; border-radius: 50%; background: var(--apagado); }
  .wm__dots .p2 { width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); }
  .wm__heart { font-family: 'Noto Color Emoji', emoji; font-size: 25px; transform: translateY(3px); display: inline-block; }
</style>
</head>
<body>
  <div id="stage">
    <div class="glow glow--1"></div>
    <div class="glow glow--2"></div>

    <span class="ember" style="left:14%; width:5px; height:5px; background:#ff8a2e; animation-duration:13s; animation-delay:0s;"></span>
    <span class="ember" style="left:33%; width:6px; height:6px; background:#ffd23a; animation-duration:15s; animation-delay:-6s;"></span>
    <span class="ember" style="left:55%; width:5px; height:5px; background:#e8420e; animation-duration:14s; animation-delay:-10s;"></span>
    <span class="ember" style="left:72%; width:7px; height:7px; background:#ff8a2e; animation-duration:12.5s; animation-delay:-4s;"></span>
    <span class="ember" style="left:88%; width:5px; height:5px; background:#ffd23a; animation-duration:16s; animation-delay:-8s;"></span>

    <div class="main">
      <div class="safe">
        <div class="pill">CALMA, JÁ VOLTA</div>

        <h1 class="title">Caiu a<br>conexão</h1>

        <div class="status">
          <span class="status__text">Reconectando</span>
          <span class="dots">
            <span class="d d1"></span>
            <span class="d d2"></span>
            <span class="heart">❤️‍🔥</span>
          </span>
        </div>

        <p class="subtitle">Respira e segura a emoção — a gente já volta.</p>
      </div>
    </div>

    <div class="wm">
      <span class="wm__text">Depois do te amo</span>
      <span class="wm__dots">
        <span class="p1"></span>
        <span class="p2"></span>
        <span class="wm__heart">❤️‍🔥</span>
      </span>
    </div>
  </div>

  <script>
    var stage = document.getElementById('stage');
    function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
    addEventListener('resize', fit); fit();
  </script>
</body>
</html>
