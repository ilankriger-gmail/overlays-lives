<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depois do Te Amo — já volto</title>

<!--
  Overlay "já volto" — Depois do Te Amo · tela cheia 1920x1080 pro OBS.
  As reticências viram indicador de "digitando…": a pausa faz parte da história.
  HTML + CSS puro, sem framework. No OBS: Browser Source 1920x1080.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Noto+Color+Emoji&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --preto: #0e0e10;
    --tinta: #17130f;
    --amarelo: #ffd23a;
    --laranja: #ff8a2e;
    --vermelho: #e8420e;
    --apagado: #5a4a3a;
    --cinza: #cabfb0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--preto); overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
  }
  #stage {
    position: absolute; top: 50%; left: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    transform-origin: center center;
    background: var(--preto); overflow: hidden;
  }

  .glow { position: absolute; border-radius: 50%; pointer-events: none; }
  .glow--1 {
    left: -14%; top: -20%; width: 820px; height: 820px;
    background: radial-gradient(circle at 45% 45%, rgba(232,66,14,.32), transparent 62%);
    filter: blur(22px); animation: glowPulse 9s ease-in-out infinite;
  }
  .glow--2 {
    right: -10%; bottom: -24%; width: 700px; height: 700px;
    background: radial-gradient(circle at 50% 50%, rgba(255,138,46,.22), transparent 62%);
    filter: blur(26px); animation: glowPulse 9s ease-in-out infinite; animation-delay: -4s;
  }
  @keyframes glowPulse { 0%,100%{opacity:.5} 30%{opacity:.85} 65%{opacity:.25} }

  .ember {
    position: absolute; bottom: -24px; border-radius: 50%;
    animation: rise linear infinite; pointer-events: none;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: .85; }
    60%  { opacity: .55; }
    100% { transform: translateY(-1180px) translateX(60px); opacity: 0; }
  }

  .main {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 46px; z-index: 1;
    animation: enter .8s ease-out both;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .pill {
    background: var(--amarelo); color: var(--tinta);
    font-weight: 700; font-size: 26px; letter-spacing: .06em;
    padding: 12px 30px; border-radius: 14px; transform: rotate(-2deg);
  }

  .title {
    margin: 0; transform: rotate(-3deg);
    font-family: 'Luckiest Guy', sans-serif; font-weight: 400;
    font-size: 220px; line-height: .94; color: #fff; text-transform: uppercase;
    text-shadow: 11px 13px 0 var(--vermelho);
  }

  /* reticências gigantes = "digitando…" */
  .dots { display: flex; align-items: center; gap: 30px; transform: rotate(-2deg); }
  .d { border-radius: 50%; display: inline-block; }
  .d1 { width: 36px; height: 36px; animation: acende1 2.6s ease-in-out infinite; }
  .d2 { width: 42px; height: 42px; animation: acende2 2.6s ease-in-out infinite; }
  .heart {
    font-family: 'Noto Color Emoji', emoji; font-size: 96px; display: inline-block;
    animation: flare 2.6s ease-in-out infinite;
  }
  @keyframes acende1 {
    0%, 8%   { background: var(--apagado); box-shadow: none; }
    18%, 78% { background: var(--laranja); box-shadow: 0 0 20px rgba(255,138,46,.85); }
    92%,100% { background: var(--apagado); box-shadow: none; }
  }
  @keyframes acende2 {
    0%, 24%  { background: var(--apagado); box-shadow: none; }
    34%, 78% { background: var(--amarelo); box-shadow: 0 0 24px rgba(255,210,58,.85); }
    92%,100% { background: var(--apagado); box-shadow: none; }
  }
  @keyframes flare {
    0%, 36%  { transform: scale(1) rotate(0deg); filter: none; }
    48%      { transform: scale(1.16) rotate(-3deg); filter: drop-shadow(0 0 24px rgba(255,138,46,.9)); }
    60%      { transform: scale(1.06) rotate(2deg); filter: drop-shadow(0 0 16px rgba(255,138,46,.7)); }
    74%, 100%{ transform: scale(1) rotate(0deg); filter: none; }
  }

  .subtitle {
    font-size: 34px; font-weight: 500; color: var(--cinza);
    margin: 0; text-align: center;
  }

  /* marca d'água horizontal — canto inferior direito, sempre */
  .wm {
    position: absolute; right: 48px; bottom: 38px; z-index: 2;
    display: flex; align-items: baseline; transform: rotate(-2deg);
  }
  .wm__text {
    font-family: 'Luckiest Guy', sans-serif; font-size: 30px; color: #fff;
    text-transform: uppercase; white-space: nowrap; padding-top: 6px;
    text-shadow: 2px 3px 0 var(--vermelho);
  }
  .wm__dots { display: inline-flex; align-items: baseline; gap: 5px; margin-left: 10px; }
  .wm__dots .p1 { width: 7px; height: 7px; border-radius: 50%; background: var(--apagado); }
  .wm__dots .p2 { width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); }
  .wm__heart { font-family: 'Noto Color Emoji', emoji; font-size: 25px; transform: translateY(3px); display: inline-block; }
</style>
</head>
<body>
  <div id="stage">
    <div class="glow glow--1"></div>
    <div class="glow glow--2"></div>

    <span class="ember" style="left:8%;  width:7px;  height:7px;  background:#ffd23a; animation-duration:9s;    animation-delay:0s;"></span>
    <span class="ember" style="left:16%; width:5px;  height:5px;  background:#ff8a2e; animation-duration:12s;   animation-delay:-4s;"></span>
    <span class="ember" style="left:27%; width:9px;  height:9px;  background:#e8420e; animation-duration:10.5s; animation-delay:-7s;"></span>
    <span class="ember" style="left:38%; width:6px;  height:6px;  background:#ffd23a; animation-duration:13s;   animation-delay:-2s;"></span>
    <span class="ember" style="left:52%; width:8px;  height:8px;  background:#ff8a2e; animation-duration:9.5s;  animation-delay:-6s;"></span>
    <span class="ember" style="left:63%; width:5px;  height:5px;  background:#ffd23a; animation-duration:14s;   animation-delay:-9s;"></span>
    <span class="ember" style="left:74%; width:10px; height:10px; background:#ff8a2e; animation-duration:11s;   animation-delay:-3s;"></span>
    <span class="ember" style="left:85%; width:6px;  height:6px;  background:#e8420e; animation-duration:12.5s; animation-delay:-8s;"></span>
    <span class="ember" style="left:93%; width:7px;  height:7px;  background:#ffd23a; animation-duration:10s;   animation-delay:-5s;"></span>

    <div class="main">
      <div class="pill">PAUSA RÁPIDA</div>

      <h1 class="title">Já volto</h1>

      <div class="dots">
        <span class="d d1"></span>
        <span class="d d2"></span>
        <span class="heart">❤️‍🔥</span>
      </div>

      <p class="subtitle">Não sai daí — a conversa ainda não acabou.</p>
    </div>

    <div class="wm">
      <span class="wm__text">Depois do te amo</span>
      <span class="wm__dots">
        <span class="p1"></span>
        <span class="p2"></span>
        <span class="wm__heart">❤️‍🔥</span>
      </span>
    </div>
  </div>

  <script>
    var stage = document.getElementById('stage');
    function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
    addEventListener('resize', fit); fit();
  </script>
</body>
</html>
